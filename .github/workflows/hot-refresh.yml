name: Hot Refresh
# 2026-11-16：刷新窗口改为北京时间 06:00–22:00（第一轮 06:00，最后一轮 22:00）。
# GitHub Actions cron 只认 UTC：06:00 CST = 22:00 UTC（前一日），22:00 CST = 14:00 UTC。

on:
  schedule:
    - cron: '0 22,23,0-14 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Hot Data
        run: python scripts/fetch_hot.py --repo-root .

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/history_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "热点广场换新：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 自动刷新"
            git push
          fi
